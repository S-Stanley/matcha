services:
  database:
    image: postgres:14.7
    container_name: matcha-postgres
    environment:
      - POSTGRES_USER=matcha
      - POSTGRES_PASSWORD=matcha
      - POSTGRES_DB=matcha
    ports:
      - 5432:5432
    restart: always
  api:
    build: services/api
    container_name: api
    env_file: .env
    ports:
      - 5000:5000
    restart: always
  webapp:
    build: 
      context: vite-project/
    container_name: webapp
    ports:
      - 4173:4173
    restart: always